name: Refresh model catalog

# Fully hands-off catalog sync. Daily (or on demand) it fetches the LIVE models-hub
# catalog, regenerates the docs, auto-fixes prose counts, writes a changelog entry,
# opens a PR, MERGES it to main, and DEPLOYS the site to GitHub Pages. When nothing
# changed it is a no-op: no PR, no merge, no deploy.
#
# SDK 7.0.0+ is dynamic-only: models are added/removed in models-hub without an SDK
# release. The common case — a model added dynamically — needs NO version bump:
# leave the version input blank and the current pin is kept, only the catalog is
# re-fetched. Pass a version only to move the SDK itself (code/param changes).
#
# Secrets / settings:
#   - PICSART_API_KEY — prod models-hub token (catalog read) for the live fetch.
#   - "Allow GitHub Actions to create and approve pull requests" must be enabled.
#
# No PAT needed. The PR is merged with GITHUB_TOKEN; because a GITHUB_TOKEN push does
# not trigger deploy-docs.yml, the final step dispatches that deploy explicitly
# (workflow_dispatch is the exception GITHUB_TOKEN is allowed to fire).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to pin (blank = keep current pin, just re-fetch the live catalog)"
        required: false
        default: ""
  schedule:
    - cron: "0 11 * * *" # daily 11:00 UTC — picks up catalog changes

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch deploy-docs.yml after merge

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Only when an SDK version is explicitly requested — a dynamic model add
      # keeps the current pin and relies on the live fetch below.
      - name: Pin @picsart/ai-sdk@${{ github.event.inputs.version }}
        if: ${{ github.event.inputs.version != '' }}
        run: npm install --save-dev --save-exact "@picsart/ai-sdk@${{ github.event.inputs.version }}"

      - name: Refresh catalog (export + data + pages + fix counts)
        env:
          PICSART_API_KEY: ${{ secrets.PICSART_API_KEY }}
        run: npm run refresh:catalog

      - name: Collect counts + date
        id: meta
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "models=$(node -e "console.log(require('./.vitepress/theme/data/models.json').length)")" >> "$GITHUB_OUTPUT"
          echo "providers=$(node -e "console.log(require('./.vitepress/theme/data/providers.json').length)")" >> "$GITHUB_OUTPUT"
          echo "sdk=$(node -e "console.log(require('./package.json').devDependencies['@picsart/ai-sdk'])")" >> "$GITHUB_OUTPUT"

      # Unattended flow: commit the changelog entry rather than drafting it into the
      # PR body. No-op when there are no model additions/removals.
      - name: Write changelog entry
        run: node scripts/draft-changelog.mjs --base HEAD --catalog .sdk-catalog.json --date "${{ steps.meta.outputs.date }}" --write

      - name: Verify build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Compose PR body
        run: |
          {
            echo "Automated, **auto-merged** catalog refresh — **${{ steps.meta.outputs.models }} models across ${{ steps.meta.outputs.providers }} providers** (@picsart/ai-sdk ${{ steps.meta.outputs.sdk }})."
            echo
            echo "Fetched live from models-hub, prose counts auto-fixed, changelog entry written, \`npm run build\` passed. Merged by the workflow. Deploy to Pages stays manual."
          } > "${RUNNER_TEMP}/pr-body.md"

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/catalog-refresh-${{ steps.meta.outputs.date }}
          base: main
          title: "docs: refresh catalog (${{ steps.meta.outputs.models }} models, ${{ steps.meta.outputs.providers }} providers)"
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: "docs: refresh catalog (${{ steps.meta.outputs.models }} models, ${{ steps.meta.outputs.providers }} providers)"
          labels: catalog-refresh
          delete-branch: true

      # Merge with GITHUB_TOKEN. A GITHUB_TOKEN push does not trigger deploy-docs on
      # its own, so the next step dispatches it explicitly. A freshly opened PR can
      # take a moment to become mergeable, so retry briefly.
      - name: Auto-merge the refresh PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="${{ steps.cpr.outputs.pull-request-number }}"
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --squash --delete-branch; then
              echo "Merged PR #$PR."
              exit 0
            fi
            echo "PR #$PR not mergeable yet (attempt $attempt) — waiting 10s…"
            sleep 10
          done
          echo "::error::Failed to merge PR #$PR after retries."
          exit 1

      # Publish the just-merged main to GitHub Pages. deploy-docs.yml has a
      # workflow_dispatch trigger, and workflow_dispatch is the exception GITHUB_TOKEN
      # *can* fire (unlike the push trigger). Runs only when a PR was merged.
      - name: Deploy to Pages
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-docs.yml --ref main
